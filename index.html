<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08060d" />
    <meta name="description" content="Cyclone [369] by XorDev. A faithful, real-time WebGPU port built with vgpu." />
    <title>Cyclone</title>
  </head>
  <body>
    <canvas id="cyclone" aria-label="实时紫色旋风"></canvas>
    <div id="notice" role="status" hidden></div>
    <div class="controls" aria-label="动画控制">
      <button id="pause" aria-label="暂停" title="暂停 / 播放（空格）">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path id="play-icon" d="M7 5v10M13 5v10"/></svg>
      </button>
      <button id="reset" aria-label="重播" title="重播（R）"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7a6 6 0 1 1-.6 5M5 3v4h4"/></svg></button>
      <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="时间" title="时间" />
      <output id="time">0.00s</output>
      <select id="speed" aria-label="播放速度" title="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <select id="quality" aria-label="画质" title="画质"><option value="auto">自动</option><option value="native">原生</option><option value="eco">省电</option></select>
      <button id="fullscreen" aria-label="全屏" title="全屏（F）"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button>
      <button id="hide" aria-label="隐藏控制" title="隐藏控制（H）"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3l14 14M7 5.5a8 8 0 0 1 3-.5c4 0 7 5 7 5a15 15 0 0 1-2 2.5M12.5 14.5a8 8 0 0 1-2.5.5c-4 0-7-5-7-5a17 17 0 0 1 2-2.5"/></svg></button>
    </div>
    <button id="show" class="show-control" aria-label="显示控制" title="显示控制（H）" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 14h12M8 3v6m4 2v6"/></svg></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
